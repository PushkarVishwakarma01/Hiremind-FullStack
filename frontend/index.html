<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />

    <!-- Title -->
    <title>HireMind | AI Career & Job Platform</title>

    <!-- SEO -->
    <meta
      name="description"
      content="HireMind is an AI-powered career platform that helps students and professionals discover jobs, opportunities, learning resources, interview preparation, and personalized career guidance."
    />

    <meta
      name="keywords"
      content="HireMind, Jobs, AI Jobs, Career, Resume, Spring Boot, React, Internship, Interview, Learning Platform"
    />

    <meta
      name="author"
      content="Pushkar Vishwakarma"
    />

    <!-- Theme Color -->
    <meta
      name="theme-color"
      content="#EC4899"
    />

    <!-- Open Graph -->
    <meta
      property="og:title"
      content="HireMind | AI Career Platform"
    />

    <meta
      property="og:description"
      content="Discover jobs, internships, learning resources, AI career guidance and interview preparation."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:image"
      content="/preview.png"
    />

    <!-- Twitter -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />

    <meta
      name="twitter:title"
      content="HireMind"
    />

    <meta
      name="twitter:description"
      content="AI Powered Career Platform"
    />

    <!-- Google Fonts -->

    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="bg-[#F8F9FD]">
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
